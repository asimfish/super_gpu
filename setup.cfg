[metadata]
name = super-gpu
version = 0.1.0
description = Agent-ready, resource-aware multi-server GPU experiment scheduler
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = super_gpu contributors
keywords = gpu, scheduler, experiments, nvidia, mcp, agent
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = .
include =
    super_gpu
    super_gpu.*

[options.package_data]
super_gpu =
    web/*.html

[options.extras_require]
mcp =
    mcp>=1.12,<2
dev =
    pytest>=7

[options.entry_points]
console_scripts =
    super-gpu = super_gpu.cli:main
    super-gpu-mcp = super_gpu.mcp_server:main
