name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    # Catch packaging regressions before a tag ever reaches release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test the CLI
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/super-gpu --version
          /tmp/wheel-venv/bin/python -c "import importlib.resources as r, super_gpu; assert r.files('super_gpu').joinpath('web/index.html').is_file()"

  e2e:
    # Real SSH + fake nvidia-smi against docker nodes; exercises monitor,
    # snapshot upload, runner identity, typed results, and output pull.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_e2e_docker.py -v
        env:
          SUPER_GPU_E2E: "1"
